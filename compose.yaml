services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${WEATHER_DB_NAME:-weatherhood}
      POSTGRES_USER: ${WEATHER_DB_USER:-weatherhood}
      POSTGRES_PASSWORD: ${WEATHER_DB_PASSWORD:?Set WEATHER_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${WEATHER_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:

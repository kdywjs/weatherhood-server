spring.application.name=weatherhood-server
spring.datasource.url=${WEATHER_DB_URL:jdbc:postgresql://localhost:5432/weatherhood}
spring.datasource.username=${WEATHER_DB_USER:weatherhood}
spring.datasource.password=${WEATHER_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.additional-path=server:/healthz
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000

# Apple 비밀키 파일은 Git 밖에서 공급하며 토큰 암호화 키는 Base64 32바이트다.
auth.apple.client-id=${APPLE_CLIENT_ID:co.kr.ansandy.weatherhood}
auth.apple.team-id=${APPLE_TEAM_ID:}
auth.apple.key-id=${APPLE_KEY_ID:}
auth.apple.private-key-path=${APPLE_PRIVATE_KEY_PATH:}
auth.token-encryption-key=${AUTH_TOKEN_ENCRYPTION_KEY:}
location.kakao.api-key=${KAKAO_REST_API_KEY:}

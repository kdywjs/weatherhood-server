spring.application.name=weatherhood-server
spring.datasource.url=${WEATHER_DB_URL:jdbc:postgresql://localhost:5432/weatherhood}
spring.datasource.username=${WEATHER_DB_USER:weatherhood}
spring.datasource.password=${WEATHER_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.port=${SERVER_PORT:8080}

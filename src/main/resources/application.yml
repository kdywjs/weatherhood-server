spring:
  application:
    name: weatherhood-server
  datasource:
    url: ${WEATHER_DB_URL:jdbc:h2:file:./data/weatherhood;DB_CLOSE_ON_EXIT=FALSE}
    username: ${WEATHER_DB_USER:sa}
    password: ${WEATHER_DB_PASSWORD:}
  sql:
    init:
      mode: always
server:
  error:
    include-message: never
    include-stacktrace: never
weather:
  kma:
    auth-key: ${KMA_API_KEY:}
    base-url: https://apihub.kma.go.kr/api/typ02/openApi/VilageFcstInfoService_2.0
    timeout: PT3S
    daily-call-budget: 19000
  collection:
    concurrency: 2
    request-budget: PT20S
    failure-cooldown: PT1M
    active-window: PT1H
    refresh-delay-ms: 60000
    stale-tolerance: PT0S
logging:
  level:
    org.springframework.web.client: OFF
    org.apache.hc.client5.http: OFF

name: weatherhood-dev
services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g
    environment:
      POSTGRES_DB: weatherhood
      POSTGRES_USER: weatherhood
      POSTGRES_PASSWORD: ${WEATHER_DB_PASSWORD:?Required}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U weatherhood -d weatherhood']
      interval: 5s
      timeout: 3s
      retries: 24
    logging: &logging
      driver: local
      options:
        max-size: 10m
        max-file: '3'
  server:
    image: ${WEATHER_IMAGE:?Required digest}
    restart: unless-stopped
    cpus: 1
    mem_limit: 2g
    stop_grace_period: 30s
    ports:
      - '192.168.1.102:9091:8080'
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Seoul
      WEATHER_DB_URL: jdbc:postgresql://postgres:5432/weatherhood
      WEATHER_DB_USER: weatherhood
      WEATHER_DB_PASSWORD: ${WEATHER_DB_PASSWORD:?Required}
      KMA_API_HUB_KEY: ${KMA_API_HUB_KEY:?Required}
      AIRKOREA_SERVICE_KEY: ${AIRKOREA_SERVICE_KEY:?Required}
      KASI_SERVICE_KEY: ${KASI_SERVICE_KEY:?Required}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:?Required}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:?Required}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:?Required}
      APPLE_KEY_ID: ${APPLE_KEY_ID:?Required}
      APPLE_PRIVATE_KEY_PATH: /run/secrets/apple-signin.p8
      AUTH_TOKEN_ENCRYPTION_KEY: ${AUTH_TOKEN_ENCRYPTION_KEY:?Required}
    volumes:
      - type: bind
        source: /opt/weatherhood-dev/secrets/apple-signin.p8
        target: /run/secrets/apple-signin.p8
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '3', 'http://localhost:8080/actuator/health/readiness']
      interval: 5s
      timeout: 4s
      retries: 24
    logging: *logging
volumes:
  postgres-data:
